<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CollabDraw — Real-Time Collaborative Drawing Canvas</title>
  <meta name="description" content="Draw together. Create together. A real-time collaborative canvas built with native HTML5 Canvas, Vanilla JS, Node.js, Express, and Socket.io." />
  <meta property="og:title" content="CollabDraw — Real-Time Collaborative Drawing Canvas" />
  <meta property="og:description" content="Draw together. Create together. A real-time collaborative canvas built with native HTML5 Canvas, Vanilla JS, Node.js, Express, and Socket.io." />
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- VIEW 1: LANDING PAGE -->
  <main id="landing-view" class="landing-view">
    <div class="landing-card" id="landing-card">
      <div class="landing-header">
        <div class="logo-mark" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
            <path d="M2 2l7.586 7.586"></path>
            <circle cx="11" cy="11" r="2"></circle>
          </svg>
        </div>
        <h1 class="app-title">CollabDraw</h1>
        <p class="app-tagline">Draw together. Create together.</p>
      </div>

      <!-- Error message container -->
      <div id="landing-error" class="error-banner hidden" role="alert">
        <span class="error-icon">⚠️</span>
        <span id="landing-error-text">Room not found. Please check the Room ID.</span>
      </div>

      <form id="landing-form" class="landing-form" onsubmit="return false;">
        <div class="form-group">
          <label for="username-input" class="form-label">Your Name</label>
          <input
            id="username-input"
            type="text"
            class="form-input"
            placeholder="e.g. Rahul, Priya, Alex"
            maxlength="24"
            required
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label for="room-input" class="form-label">Room ID <span class="label-optional">(optional for creating)</span></label>
          <input
            id="room-input"
            type="text"
            class="form-input"
            placeholder="e.g. ABC123"
            maxlength="16"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <div class="landing-actions">
          <button type="button" id="btn-create-room" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Create Room</span>
          </button>
          <button type="button" id="btn-join-room" class="btn btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span>Join Room</span>
          </button>
        </div>
      </form>

      <div class="landing-features">
        <span class="feature-item">✓ Real-time streaming strokes</span>
        <span class="feature-item">✓ Multi-user remote cursors</span>
        <span class="feature-item">✓ Global undo &amp; redo</span>
      </div>
    </div>
  </main>

  <!-- VIEW 2: DRAWING WORKSPACE -->
  <div id="workspace-view" class="workspace-view hidden">
    <!-- Top Header -->
    <header class="app-header" id="app-header">
      <div class="header-left">
        <div class="header-brand">
          <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
            <path d="M2 2l7.586 7.586"></path>
            <circle cx="11" cy="11" r="2"></circle>
          </svg>
          <span class="brand-name">CollabDraw</span>
        </div>

        <div class="room-badge" id="room-badge" title="Current Collaboration Room">
          <span class="room-label">Room:</span>
          <span id="current-room-id" class="room-code">------</span>
        </div>

        <div id="connection-indicator" class="connection-status status-connected" title="Socket.io Connection Status">
          <span class="status-dot"></span>
          <span id="connection-text">Connected</span>
        </div>
      </div>

      <div class="header-right">
        <button type="button" id="btn-copy-link" class="btn btn-sm btn-outline" title="Copy shareable room URL to clipboard">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span class="btn-text">Copy Link</span>
        </button>

        <button type="button" id="btn-toggle-users" class="btn btn-sm btn-outline" title="Toggle active collaborators list">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span class="btn-text">Users (<span id="user-count-badge">1</span>)</span>
        </button>

        <div id="current-user-chip" class="user-chip" title="You">
          <span id="current-user-dot" class="user-dot"></span>
          <span id="current-username" class="user-name">You</span>
        </div>

        <button type="button" id="btn-leave-room" class="btn btn-sm btn-ghost" title="Leave room and return to landing page">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span class="btn-text">Leave</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="canvas-workspace" id="canvas-workspace">
      <!-- Canvas and Overlay Area -->
      <div class="canvas-stage" id="canvas-stage">
        <canvas id="drawing-canvas" class="drawing-canvas"></canvas>
        <div id="cursor-overlay" class="cursor-overlay" aria-hidden="true"></div>
      </div>

      <!-- Online Users Floating / Collapsible Drawer Panel -->
      <aside id="users-panel" class="users-panel" aria-label="Collaborators">
        <div class="panel-header">
          <h2 class="panel-title">
            <span>ONLINE USERS</span>
            <span id="panel-user-count" class="badge">1</span>
          </h2>
          <button type="button" id="btn-close-users-panel" class="panel-close-btn" aria-label="Close users panel">✕</button>
        </div>
        <ul id="users-list" class="users-list" role="list">
          <!-- Populated dynamically: ● You, ● Rahul, etc. -->
        </ul>
      </aside>
    </div>

    <!-- Bottom Drawing Toolbar -->
    <footer class="app-toolbar" id="toolbar" role="toolbar" aria-label="Drawing Tools">
      <!-- Tool Selection: Brush vs Eraser -->
      <div class="toolbar-group tool-selection">
        <button type="button" id="tool-brush" class="tool-btn active" data-tool="brush" title="Brush Tool (B)" aria-label="Brush Tool">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
            <path d="M2 2l7.586 7.586"></path>
            <circle cx="11" cy="11" r="2"></circle>
          </svg>
          <span class="tool-label">Brush</span>
        </button>
        <button type="button" id="tool-eraser" class="tool-btn" data-tool="eraser" title="Eraser Tool (E)" aria-label="Eraser Tool">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"></path>
            <path d="M17 17L7 7"></path>
          </svg>
          <span class="tool-label">Eraser</span>
        </button>
      </div>

      <div class="toolbar-divider" aria-hidden="true"></div>

      <!-- Color Palette -->
      <div class="toolbar-group color-palette" id="color-palette" role="radiogroup" aria-label="Color Palette">
        <!-- Preset swatches -->
        <button type="button" class="color-swatch active" data-color="#1e293b" style="--swatch-color: #1e293b" title="Slate Black" aria-label="Color Slate Black"></button>
        <button type="button" class="color-swatch" data-color="#ef4444" style="--swatch-color: #ef4444" title="Red" aria-label="Color Red"></button>
        <button type="button" class="color-swatch" data-color="#f97316" style="--swatch-color: #f97316" title="Orange" aria-label="Color Orange"></button>
        <button type="button" class="color-swatch" data-color="#eab308" style="--swatch-color: #eab308" title="Yellow" aria-label="Color Yellow"></button>
        <button type="button" class="color-swatch" data-color="#22c55e" style="--swatch-color: #22c55e" title="Green" aria-label="Color Green"></button>
        <button type="button" class="color-swatch" data-color="#3b82f6" style="--swatch-color: #3b82f6" title="Blue" aria-label="Color Blue"></button>
        <button type="button" class="color-swatch" data-color="#8b5cf6" style="--swatch-color: #8b5cf6" title="Purple" aria-label="Color Purple"></button>
        <button type="button" class="color-swatch" data-color="#ec4899" style="--swatch-color: #ec4899" title="Pink" aria-label="Color Pink"></button>
        <button type="button" class="color-swatch" data-color="#ffffff" style="--swatch-color: #ffffff" title="White" aria-label="Color White"></button>

        <!-- Native Color Picker -->
        <label class="color-picker-wrapper" title="Custom Color Picker">
          <input type="color" id="native-color-picker" value="#1e293b" aria-label="Custom Color Picker" />
          <span class="color-picker-icon" aria-hidden="true">🎨</span>
        </label>
      </div>

      <div class="toolbar-divider" aria-hidden="true"></div>

      <!-- Stroke Width Slider -->
      <div class="toolbar-group stroke-width-group">
        <div class="stroke-preview-circle" id="stroke-preview" title="Current stroke size preview"></div>
        <div class="width-slider-wrap">
          <div class="width-label-wrap">
            <span id="width-label" class="width-label">Thickness: 5 px</span>
          </div>
          <input
            type="range"
            id="width-slider"
            class="width-slider"
            min="1"
            max="50"
            value="5"
            aria-label="Stroke Thickness"
          />
        </div>
      </div>

      <div class="toolbar-divider" aria-hidden="true"></div>

      <!-- History and Canvas Actions -->
      <div class="toolbar-group action-buttons">
        <button type="button" id="btn-undo" class="tool-btn action-btn" title="Undo (Ctrl+Z)" aria-label="Undo">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7v6h6"></path>
            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
          </svg>
          <span class="tool-label">Undo</span>
        </button>

        <button type="button" id="btn-redo" class="tool-btn action-btn" title="Redo (Ctrl+Y)" aria-label="Redo">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 7v6h-6"></path>
            <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path>
          </svg>
          <span class="tool-label">Redo</span>
        </button>

        <button type="button" id="btn-clear" class="tool-btn action-btn danger" title="Clear Canvas" aria-label="Clear Canvas">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span class="tool-label">Clear</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- Socket.io client script served automatically by Socket.io server -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Modular Vanilla JavaScript Application -->
  <script type="module" src="/js/main.js"></script>
</body>
</html>
